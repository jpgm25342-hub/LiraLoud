<div id="modal-ocr-decision" class="overlay-bloqueante">
            <div class="modal-ocr-card"
                style="width: 540px; max-width: 92vw; background: #1e293b; color: #f8fafc; border-radius: 14px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid #334155; box-sizing: border-box;">
                <div
                    style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 12px;">
                    <span style="font-size: 26px;">🖼️</span>
                    <div>
                        <h3 style="margin:0; font-size: 17px; color: #38bdf8;" data-i18n="ocr-dec-titulo">Documento Escaneado Detectado</h3>
                        <span style="font-size: 12px; color: #94a3b8;" data-i18n="ocr-dec-sub">Tu archivo contiene páginas en imagen sin texto digital incrustado</span>
                    </div>
                </div>

                <p style="font-size: 13px; line-height: 1.5; color: #cbd5e1; margin-bottom: 18px;" data-i18n="ocr-dec-desc">
                    Para habilitar el <b>karaoke visual</b> y la <b>lectura por voz</b>, es necesario extraer el texto mediante RapidOCR. ¿Cómo prefieres procesarlo?
                </p>

                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                    <!-- Opción 1: Procesar Todo -->
                    <button type="button" onclick="seleccionarOpcionOCR('batch')"
                        style="display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 10px; background: #0f172a; border: 1.5px solid #0284c7; cursor: pointer; transition: all 0.2s ease; color: inherit;"
                        onmouseover="this.style.background='#0369a1'; this.style.borderColor='#38bdf8';"
                        onmouseout="this.style.background='#0f172a'; this.style.borderColor='#0284c7';">
                        <span style="font-size: 22px; line-height: 1;">⚡</span>
                        <div>
                            <div style="font-weight: bold; font-size: 13.5px; color: #38bdf8;"><span data-i18n="ocr-dec-opt1-titulo">Procesar todo el documento ahora</span> <span
                                    style="font-size: 11px; background: #0284c7; color: white; padding: 2px 6px; border-radius: 6px; margin-left: 6px;" data-i18n="ocr-dec-recomendado">Recomendado</span>
                            </div>
                            <div style="font-size: 12px; color: #94a3b8; margin-top: 3px;" data-i18n="ocr-dec-opt1-desc">
                                Escaneará todas las páginas en segundo plano para una lectura fluida e instantánea.
                            </div>
                        </div>
                    </button>

                    <!-- Opción 2: Rango de páginas específico -->
                    <button type="button" onclick="abrirModalRangoOCR()"
                        style="display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 10px; background: #0f172a; border: 1.5px solid #0284c7; cursor: pointer; transition: all 0.2s ease; color: inherit;"
                        onmouseover="this.style.background='#0369a1'; this.style.borderColor='#38bdf8';"
                        onmouseout="this.style.background='#0f172a'; this.style.borderColor='#0284c7';">
                        <span style="font-size: 22px; line-height: 1;">🎯</span>
                        <div>
                            <div style="font-weight: bold; font-size: 13.5px; color: #38bdf8;" data-i18n="ocr-dec-opt2-titulo">Procesar un rango de páginas específico</div>
                            <div style="font-size: 12px; color: #94a3b8; margin-top: 3px;" data-i18n="ocr-dec-opt2-desc">
                                Elige exactamente qué páginas digitalizar con vistas previas en miniatura.
                            </div>
                        </div>
                    </button>

                    <!-- Opción 3: Página por página -->
                    <button type="button" onclick="seleccionarOpcionOCR('demanda')"
                        style="display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 10px; background: #0f172a; border: 1.5px solid #475569; cursor: pointer; transition: all 0.2s ease; color: inherit;"
                        onmouseover="this.style.background='#1e293b'; this.style.borderColor='#94a3b8';"
                        onmouseout="this.style.background='#0f172a'; this.style.borderColor='#475569';">
                        <span style="font-size: 22px; line-height: 1;">📄</span>
                        <div>
                            <div style="font-weight: bold; font-size: 13.5px; color: #e2e8f0;" data-i18n="ocr-dec-opt3-titulo">Procesar página por página sobre la marcha</div>
                            <div style="font-size: 12px; color: #94a3b8; margin-top: 3px;" data-i18n="ocr-dec-opt3-desc">
                                Abre el documento y escanea automáticamente solo la página que estés leyendo.
                            </div>
                        </div>
                    </button>
                </div>

                <div
                    style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #334155; padding-top: 12px;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" id="chk-ocr-recordar-decision"> <span data-i18n="ocr-dec-recordar">Recordar preferencia</span>
                    </label>
                    <button type="button" onclick="ignorarYEntrarAlPDF()"
                        style="background: #334155; color: #cbd5e1; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s ease;"
                        onmouseover="this.style.background='#475569'; this.style.color='#fff';"
                        onmouseout="this.style.background='#334155'; this.style.color='#cbd5e1';" data-i18n="ocr-dec-ignorar">
                        Ignorar y entrar al documento ➔
                    </button>
                </div>
            </div>
        </div>
