<div id="modal-ocr-decision" class="overlay-bloqueante modal-ocr-overlay"
    onclick="if(event.target === this) cerrarModalOCRDecision()">
    <div class="modal-ocr-card" onclick="event.stopPropagation()">
        <div class="ocr-modal-header">
            <span class="ocr-modal-icon-badge">
                <svg class="lira-svg-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </span>
            <div>
                <h3 class="ocr-modal-title" data-i18n="ocr-dec-titulo">Documento Escaneado Detectado</h3>
                <span class="ocr-modal-subtitle" data-i18n="ocr-dec-sub">Tu archivo contiene páginas en imagen sin texto digital incrustado</span>
            </div>
        </div>

        <p class="ocr-modal-desc" data-i18n="ocr-dec-desc">
            Para habilitar el <b>karaoke visual</b> y la <b>lectura por voz</b>, es necesario extraer el texto mediante RapidOCR. ¿Cómo prefieres procesarlo?
        </p>

        <div class="ocr-decision-options">
            <!-- Opción 1: Procesar Todo -->
            <button type="button" class="ocr-decision-btn" onclick="seleccionarOpcionOCR('batch')">
                <span class="ocr-decision-icon">
                    <svg class="lira-svg-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </span>
                <div>
                    <div class="ocr-decision-title">
                        <span data-i18n="ocr-dec-opt1-titulo">Procesar todo el documento ahora</span>
                        <span class="ocr-decision-badge" data-i18n="ocr-dec-recomendado">Recomendado</span>
                    </div>
                    <div class="ocr-decision-desc" data-i18n="ocr-dec-opt1-desc">
                        Escaneará todas las páginas en segundo plano para una lectura fluida e instantánea.
                    </div>
                </div>
            </button>

            <!-- Opción 2: Rango de páginas específico -->
            <button type="button" class="ocr-decision-btn" onclick="abrirModalRangoOCR()">
                <span class="ocr-decision-icon">
                    <svg class="lira-svg-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                </span>
                <div>
                    <div class="ocr-decision-title" data-i18n="ocr-dec-opt2-titulo">Procesar un rango de páginas específico</div>
                    <div class="ocr-decision-desc" data-i18n="ocr-dec-opt2-desc">
                        Elige exactamente qué páginas digitalizar con vistas previas en miniatura.
                    </div>
                </div>
            </button>

            <!-- Opción 3: Página por página -->
            <button type="button" class="ocr-decision-btn ocr-decision-btn-secondary" onclick="seleccionarOpcionOCR('demanda')">
                <span class="ocr-decision-icon">
                    <svg class="lira-svg-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                </span>
                <div>
                    <div class="ocr-decision-title" data-i18n="ocr-dec-opt3-titulo">Procesar página por página sobre la marcha</div>
                    <div class="ocr-decision-desc" data-i18n="ocr-dec-opt3-desc">
                        Abre el documento y escanea automáticamente solo la página que estés leyendo.
                    </div>
                </div>
            </button>
        </div>

        <div class="ocr-modal-footer">
            <label class="ocr-remember-label">
                <input type="checkbox" id="chk-ocr-recordar-decision">
                <span data-i18n="ocr-dec-recordar">Recordar preferencia</span>
            </label>
            <button type="button" class="ocr-btn-ghost" onclick="ignorarYEntrarAlPDF()">
                <span data-i18n="ocr-dec-ignorar">Ignorar y entrar al documento</span>
                <svg class="lira-svg-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </div>
</div>
