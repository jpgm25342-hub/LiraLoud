<div id="modal-ver-captura" class="overlay-bloqueante modal-captura-overlay modal-ver-captura-overlay"
    onclick="if(event.target === this) cerrarModalVerCaptura()">
    <div class="modal-captura-card modal-ver-captura-card" onclick="event.stopPropagation()">
        <div class="modal-captura-header">
            <div class="modal-captura-title-wrap">
                <svg class="lira-svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span id="lightbox-titulo-captura" class="modal-ver-captura-titulo" data-i18n="cap-ver-titulo">Título de captura</span>
                <span id="lightbox-pag-captura" class="modal-captura-badge" data-i18n="ocr-rango-pag1">Pág. 1</span>
            </div>
            <div class="modal-captura-header-actions">
                <button type="button" id="lightbox-btn-copiar" class="btn-captura-copiar">
                    <svg class="lira-svg-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                    </svg>
                    <span id="lightbox-btn-copiar-texto" data-i18n="cap-btn-copiar-img">Copiar Imagen</span>
                </button>
                <button type="button" class="modal-captura-close" onclick="cerrarModalVerCaptura()" title="Cerrar" data-i18n-title="btn-cerrar" aria-label="Cerrar">&times;</button>
            </div>
        </div>
        <div class="modal-ver-captura-body">
            <img id="lightbox-img-captura" alt="Captura ampliada">
        </div>
    </div>
</div>
