<div id="modal-ocr-rango" class="overlay-bloqueante modal-ocr-overlay" style="display: none;"
    onclick="if(event.target === this) cerrarModalRangoOCR()">
    <div class="modal-ocr-card modal-ocr-rango-card" onclick="event.stopPropagation()">
        <div class="ocr-rango-header">
            <h3 class="ocr-modal-title" data-i18n="ocr-rango-titulo">Escanear Rango de Páginas con OCR</h3>
            <span class="ocr-modal-subtitle" data-i18n="ocr-rango-sub">Verifica las miniaturas para seleccionar con precisión tus páginas útiles</span>
        </div>

        <!-- Contenedor de 2 vistas previas -->
        <div class="ocr-rango-preview-container">
            <!-- Tarjeta Desde -->
            <div class="ocr-rango-card">
                <span class="ocr-rango-header-label">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon" aria-hidden="true">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                        <line x1="4" y1="22" x2="4" y2="15"></line>
                    </svg>
                    <span data-i18n="ocr-rango-desde">Desde Página</span>
                </span>
                <div class="ocr-rango-input-group">
                    <button type="button" class="ocr-rango-btn-step" onclick="cambiarPasoRangoOCR('desde', -1)">-</button>
                    <input type="number" id="ocr-rango-input-desde" class="ocr-rango-input" min="1" value="1" onchange="actualizarPreviewRangoOCR('desde')">
                    <button type="button" class="ocr-rango-btn-step" onclick="cambiarPasoRangoOCR('desde', 1)">+</button>
                </div>
                <div class="ocr-rango-img-box">
                    <img id="ocr-rango-img-desde" src="" alt="Cargando...">
                    <span id="ocr-rango-tag-desde" class="ocr-rango-img-tag" data-i18n="ocr-rango-pag1">Pág. 1</span>
                </div>
            </div>

            <!-- Tarjeta Hasta -->
            <div class="ocr-rango-card">
                <span class="ocr-rango-header-label">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon" aria-hidden="true">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                        <line x1="4" y1="22" x2="4" y2="15"></line>
                    </svg>
                    <span data-i18n="ocr-rango-hasta">Hasta Página</span>
                </span>
                <div class="ocr-rango-input-group">
                    <button type="button" class="ocr-rango-btn-step" onclick="cambiarPasoRangoOCR('hasta', -1)">-</button>
                    <input type="number" id="ocr-rango-input-hasta" class="ocr-rango-input" min="1" value="1" onchange="actualizarPreviewRangoOCR('hasta')">
                    <button type="button" class="ocr-rango-btn-step" onclick="cambiarPasoRangoOCR('hasta', 1)">+</button>
                </div>
                <div class="ocr-rango-img-box">
                    <img id="ocr-rango-img-hasta" src="" alt="Cargando...">
                    <span id="ocr-rango-tag-hasta" class="ocr-rango-img-tag" data-i18n="ocr-rango-pag1">Pág. 1</span>
                </div>
            </div>
        </div>

        <div id="ocr-rango-resumen" class="ocr-rango-resumen" data-i18n="ocr-rango-resumen-default">
            Total a procesar: 1 página
        </div>

        <div class="ocr-rango-footer">
            <button type="button" class="ocr-btn-secondary" onclick="volverADecisionOCR()" data-i18n="btn-volver">
                Volver
            </button>
            <button type="button" id="btn-ocr-rango-confirmar" class="ocr-btn-primary" onclick="iniciarRangoOCRConfirmado()" data-i18n="ocr-rango-iniciar">
                Iniciar OCR en este Rango
            </button>
        </div>
    </div>
</div>
