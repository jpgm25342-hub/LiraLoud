<div id="panel-nota-rapida" onclick="event.stopPropagation()">
            <!-- Header -->
            <div class="nota-rapida-header">
                <div class="nota-rapida-titulo">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px; color:#0284c7;">
                        <path d="M11 4H4C3.44772 4 3 4.44772 3 5V20C3 20.5523 3.44772 21 4 21H19C19.5523 21 20 20.5523 20 20V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M18.5 2.5C19.3284 1.67157 20.6716 1.67157 21.5 2.5C22.3284 3.32843 22.3284 4.67157 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span data-i18n="nota-rapida-titulo">Nota Rápida</span>
                    <span id="nota-rapida-lbl-pag" class="nota-pill" style="font-size:10px;" data-i18n="ocr-rango-pag1">Pág. 1</span>
                </div>
                <div class="nota-rapida-controles">
                    <button class="notas-btn-sec" id="btn-nota-rapida-cuaderno" onclick="toggleModalNotas(); cerrarPanelNotaRapida();" title="Abrir Gestor Completo de Notas" data-i18n-title="nota-rapida-abrir-cuaderno" data-i18n="nota-rapida-btn-cuaderno" style="padding:3px 7px; font-size:11px;">
                        📖 Cuaderno
                    </button>
                    <button class="notas-btn-close" onclick="cerrarPanelNotaRapida()" title="Cerrar (Esc)" data-i18n-title="btn-cerrar">✕</button>
                </div>
            </div>

            <!-- Cuerpo / Editor -->
            <div class="nota-rapida-body">
                <input type="text" id="nota-rapida-titulo-input" class="nota-rapida-input-titulo" placeholder="Título de la nota..." data-i18n-placeholder="notas-ph-titulo">
                
                <div class="nota-rapida-row-meta">
                    <span style="color:#64748b; font-weight:600;" data-i18n="notas-lbl-area">🏷️ Área:</span>
                    <input type="text" id="nota-rapida-clasif-input" list="dl-clasificaciones-rapida" class="notas-meta-input" placeholder="Clasificación..." data-i18n-placeholder="notas-ph-clasif" value="General" style="flex:1;">
                    <datalist id="dl-clasificaciones-rapida"></datalist>
                    <input type="number" id="nota-rapida-pagina" class="notas-meta-input" value="1" min="1" style="width:45px;" title="Número de página" data-i18n-title="notas-num-pag">
                </div>

                <!-- Mini Toolbar de Formato -->
                <div class="notas-format-toolbar" style="padding:4px 0; background:transparent; border-bottom:none; position:relative;">
                    <button class="notas-fmt-btn" id="btn-fmt-bold-rapida" onclick="aplicarFormatoNota('bold', null, 'nota-rapida-editor-content')" title="Negrita (B)" data-i18n-title="fmt-negrita"><b>B</b></button>
                    <button class="notas-fmt-btn" id="btn-fmt-italic-rapida" onclick="aplicarFormatoNota('italic', null, 'nota-rapida-editor-content')" title="Cursiva (I)" data-i18n-title="fmt-cursiva"><i>I</i></button>
                    <button class="notas-fmt-btn" id="btn-fmt-underline-rapida" onclick="aplicarFormatoNota('underline', null, 'nota-rapida-editor-content')" title="Subrayado (U)" data-i18n-title="fmt-subrayado"><u>U</u></button>
                    <button class="notas-fmt-btn" id="btn-fmt-strike-rapida" onclick="aplicarFormatoNota('strikeThrough', null, 'nota-rapida-editor-content')" title="Tachado" data-i18n-title="fmt-tachado"><s>S</s></button>
                    <div class="notas-fmt-sep"></div>
                    <button class="notas-fmt-btn" id="btn-fmt-h1-rapida" onmousedown="event.preventDefault()" onclick="aplicarFormatoNota('heading', '<h1>', 'nota-rapida-editor-content')" title="Encabezado 1" data-i18n-title="fmt-h1">H1</button>
                    <button class="notas-fmt-btn" id="btn-fmt-h2-rapida" onmousedown="event.preventDefault()" onclick="aplicarFormatoNota('heading', '<h2>', 'nota-rapida-editor-content')" title="Encabezado 2" data-i18n-title="fmt-h2">H2</button>
                    <button class="notas-fmt-btn" id="btn-fmt-h3-rapida" onmousedown="event.preventDefault()" onclick="aplicarFormatoNota('heading', '<h3>', 'nota-rapida-editor-content')" title="Encabezado 3" data-i18n-title="fmt-h3">H3</button>
                    <div class="notas-fmt-sep"></div>
                    <button class="notas-fmt-btn" onclick="aplicarFormatoNota('insertUnorderedList', null, 'nota-rapida-editor-content')" title="Lista" data-i18n-title="fmt-lista">•</button>
                    <button class="notas-fmt-btn" onclick="aplicarFormatoNota('highlight', '#fff3cd', 'nota-rapida-editor-content')" title="Resaltador" data-i18n-title="fmt-resaltador" style="background:#fff3cd; color:#856404; font-size:10px;">A</button>

                    <button class="notas-btn-mic" id="btn-dictar-nota-rapida" onclick="toggleDictadoVoz('nota-rapida-editor-content', 'btn-dictar-nota-rapida')" title="Dictar por Voz (Micrófono)" data-i18n-title="notas-dictar-title">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                        <span class="btn-mic-txt" data-i18n="notas-btn-dictar">Dictar</span>
                    </button>

                    <!-- Botón IA con menú desplegable -->
                    <div style="position:relative; margin-left:auto;">
                        <button class="notas-btn-ia" id="btn-ia-nota-rapida" onclick="toggleMenuIANota('rapida')" title="Opciones de Inteligencia Artificial para esta nota" data-i18n-title="notas-ia-title" data-i18n="notas-btn-ia">
                            ✨ IA
                        </button>
                        <div id="menu-ia-nota-rapida" class="menu-ia-nota-popup">
                            <button class="menu-ia-nota-item" onclick="ejecutarAccionIANota('mejorar', 'nota-rapida-editor-content', 'nota-rapida-titulo-input')">
                                <span>✍️</span> <span data-i18n="notas-ia-mejorar">Mejorar redacción</span>
                            </button>
                            <button class="menu-ia-nota-item" onclick="ejecutarAccionIANota('ortografia', 'nota-rapida-editor-content', 'nota-rapida-titulo-input')">
                                <span>🔤</span> <span data-i18n="notas-ia-ortografia">Corregir ortografía</span>
                            </button>
                            <button class="menu-ia-nota-item" onclick="ejecutarAccionIANota('expandir', 'nota-rapida-editor-content', 'nota-rapida-titulo-input')">
                                <span>💡</span> <span data-i18n="notas-ia-expandir">Explicar conceptos</span>
                            </button>
                            <button class="menu-ia-nota-item" onclick="ejecutarAccionIANota('custom', 'nota-rapida-editor-content', 'nota-rapida-titulo-input')">
                                <span>🎯</span> <span data-i18n="notas-ia-custom">Petición personalizada...</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Área editable -->
                <div id="nota-rapida-editor-content" class="nota-rapida-editor" contenteditable="true" placeholder="Escribe tus apuntes aquí..." data-i18n-placeholder="notas-ph-apuntes"></div>
            </div>

            <!-- Footer -->
            <div class="nota-rapida-footer">
                <button class="notas-btn-sec" onclick="cerrarPanelNotaRapida()" style="font-size:11px;" data-i18n="btn-cancelar">Cancelar</button>
                <button class="notas-btn-save" id="btn-guardar-nota-rapida" onclick="guardarNotaRapida()" style="padding:5px 14px; font-size:12px;" data-i18n="btn-guardar">Guardar</button>
            </div>
        </div>
