<div id="modal-guardar-captura" class="overlay-bloqueante" style="display:none; z-index:100000; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); pointer-events:auto !important;"
            onclick="if(event.target === this) cerrarModalGuardarCaptura()">
            <div style="background:#ffffff; width:440px; max-width:92vw; border-radius:12px; box-shadow:0 12px 35px rgba(0,0,0,0.3); overflow:hidden; display:flex; flex-direction:column; animation:fadeIn 0.2s ease; pointer-events:auto !important;" onclick="event.stopPropagation()">
                <div style="padding:16px 20px; background:#2c3e50; color:#ffffff; display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px;">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span data-i18n="cap-guardar-titulo">Guardar Recorte en Extracciones</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span id="lbl-captura-pagina" style="font-size:11px; background:rgba(255,255,255,0.2); padding:3px 8px; border-radius:12px;" data-i18n="cap-pag-default">Página 1</span>
                        <button type="button" onclick="cerrarModalGuardarCaptura()" style="background:none; border:none; color:#ffffff; font-size:16px; cursor:pointer; padding:0 4px; line-height:1;" title="Cerrar" data-i18n-title="btn-cerrar">✕</button>
                    </div>
                </div>
                <div style="padding:18px 20px; display:flex; flex-direction:column; gap:14px;">
                    <div style="width:100%; max-height:220px; overflow:hidden; border-radius:8px; border:1px solid #e1e8ed; background:#f8f9fa; display:flex; justify-content:center; align-items:center; box-shadow:inset 0 0 8px rgba(0,0,0,0.03);">
                        <img id="preview-recorte-img" style="max-width:100%; max-height:220px; object-fit:contain; display:block;" alt="Vista previa del recorte">
                    </div>
                    <div>
                        <label for="input-titulo-captura" style="display:block; font-size:12px; font-weight:600; color:#34495e; margin-bottom:6px;" data-i18n="cap-lbl-nombre">
                            Nombre o motivo de la captura:
                        </label>
                        <input type="text" id="input-titulo-captura" placeholder="Ej: Algoritmo Dijkstra, Diagrama de flujo, Gráfica..." data-i18n-placeholder="cap-ph-nombre"
                            style="width:100%; padding:10px 12px; font-size:13px; border:1.5px solid #bdc3c7; border-radius:6px; outline:none; transition:border-color 0.2s; box-sizing:border-box;"
                            onfocus="this.style.borderColor='#3498db'" onblur="this.style.borderColor='#bdc3c7'">
                        <div style="font-size:11px; color:#7f8c8d; margin-top:4px;" data-i18n="cap-ayuda">
                            Guarda fórmulas, algoritmos, tablas o fotos para repasarlos en cualquier momento.
                        </div>
                    </div>
                </div>
                <div style="padding:12px 20px; background:#f8f9fa; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" id="btn-cancelar-captura" onclick="cerrarModalGuardarCaptura()" data-i18n="btn-cancelar">
                        Cancelar
                    </button>
                    <button type="button" id="btn-confirmar-captura" onclick="confirmarGuardarCaptura()" data-i18n="cap-btn-guardar">
                        Guardar Captura
                    </button>
                </div>
            </div>
        </div>
