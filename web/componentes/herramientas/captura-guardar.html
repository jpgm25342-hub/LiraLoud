<div id="modal-guardar-captura" class="overlay-bloqueante modal-captura-overlay"
    onclick="if(event.target === this) cerrarModalGuardarCaptura()">
    <div class="modal-captura-card modal-guardar-captura-card" onclick="event.stopPropagation()">
        <div class="modal-captura-header">
            <div class="modal-captura-title-wrap">
                <svg class="lira-svg-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span data-i18n="cap-guardar-titulo">Guardar Recorte en Extracciones</span>
            </div>
            <div class="modal-captura-header-actions">
                <span id="lbl-captura-pagina" class="modal-captura-badge" data-i18n="cap-pag-default">Página 1</span>
                <button type="button" class="modal-captura-close" onclick="cerrarModalGuardarCaptura()" title="Cerrar" data-i18n-title="btn-cerrar" aria-label="Cerrar">&times;</button>
            </div>
        </div>
        <div class="modal-captura-body">
            <div class="modal-captura-preview-box">
                <img id="preview-recorte-img" alt="Vista previa del recorte">
            </div>
            <div class="modal-captura-field">
                <label for="input-titulo-captura" class="modal-captura-label" data-i18n="cap-lbl-nombre">
                    Nombre o motivo de la captura:
                </label>
                <input type="text" id="input-titulo-captura" class="modal-captura-input"
                    placeholder="Ej: Algoritmo Dijkstra, Diagrama de flujo, Gráfica..." data-i18n-placeholder="cap-ph-nombre">
                <div class="modal-captura-help" data-i18n="cap-ayuda">
                    Guarda fórmulas, algoritmos, tablas o fotos para repasarlos en cualquier momento.
                </div>
            </div>
        </div>
        <div class="modal-captura-footer">
            <button type="button" id="btn-cancelar-captura" onclick="cerrarModalGuardarCaptura()" data-i18n="btn-cancelar">
                Cancelar
            </button>
            <button type="button" id="btn-confirmar-captura" onclick="confirmarGuardarCaptura()" data-i18n="cap-btn-guardar">
                Guardar Captura
            </button>
        </div>
    </div>
</div>
