<div id="modal-subrayados" class="overlay-diccionario modal-subrayados-overlay"
    style="display:none;"
    onclick="if(event.target === this) cerrarPanelSubrayados()">
    <div id="panel-subrayados" class="subrayador-panel">
        <div class="header-ia">
            <div class="header-ia-titulo">
                <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    style="width:20px;height:20px;" aria-hidden="true">
                    <path d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
                <span data-i18n="ext-titulo">Gestor de Extracción</span>
            </div>
            <div class="header-ia-acciones">
                <button type="button" class="btn-cerrar-ia" onclick="cerrarPanelSubrayados()" title="Cerrar Gestor" data-i18n-title="ext-cerrar" aria-label="Cerrar">&times;</button>
            </div>
        </div>
        <div class="subrayador-subtitulo" data-i18n="ext-sub">
            Textos resaltados sincronizados con el PDF.
        </div>
        <!-- SECCIÓN DE FILTROS -->
        <div class="subrayador-filtros">
            <div class="subrayador-filtros-head">
                <span data-i18n="ext-filtros">Filtros</span>
                <button type="button" class="subrayador-limpiar-btn" onclick="limpiarFiltrosSubrayados()" data-i18n="ext-limpiar">Limpiar</button>
            </div>
            <div class="subrayador-filtros-row">
                <select id="filter-color" class="subrayador-select" onchange="aplicarFiltrosSubrayados()">
                    <option value="" data-i18n="ext-color-todos">Todos los colores</option>
                    <option value="#FFFF00" data-i18n="color-amarillo">Amarillo</option>
                    <option value="#00FF00" data-i18n="color-verde">Verde</option>
                    <option value="#00FFFF" data-i18n="color-cian">Cian</option>
                    <option value="#FF00FF" data-i18n="color-magenta">Magenta</option>
                    <option value="#f1c40f" data-i18n="color-naranja">Naranja</option>
                    <option value="#e74c3c" data-i18n="color-rojo">Rojo</option>
                </select>
                <input type="number" id="filter-page" class="subrayador-input-pag" placeholder="Pág..." data-i18n-placeholder="ext-ph-pag" oninput="aplicarFiltrosSubrayados()" min="1">
            </div>
        </div>
        <!-- PESTAÑAS: TODAS / SUBRAYADOS / CAPTURAS -->
        <div class="tabs-extraccion">
            <button type="button" class="tab-extraccion active" data-tab="todas" onclick="cambiarTabExtraccion('todas')">
                <span data-i18n="ext-tab-todas">Todas</span> <span id="count-ext-todas" class="subrayador-tab-count">(0)</span>
            </button>
            <button type="button" class="tab-extraccion" data-tab="textos" onclick="cambiarTabExtraccion('textos')">
                <span class="subrayador-tab-label">
                    <svg class="lira-svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <span data-i18n="ext-tab-subrayados">Subrayados</span> <span id="count-ext-textos" class="subrayador-tab-count">(0)</span>
                </span>
            </button>
            <button type="button" class="tab-extraccion" data-tab="capturas" onclick="cambiarTabExtraccion('capturas')">
                <span class="subrayador-tab-label">
                    <svg class="lira-svg-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <span data-i18n="ext-tab-capturas">Capturas</span> <span id="count-ext-capturas" class="subrayador-tab-count">(0)</span>
                </span>
            </button>
        </div>
        <div id="extracted-texts" class="subrayador-lista">
            <!-- Aquí se inyectan las tarjetas de texto y capturas visuales -->
        </div>
    </div>
</div>
