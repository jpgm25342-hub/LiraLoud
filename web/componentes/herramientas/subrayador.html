<div id="modal-subrayados" class="overlay-diccionario"
            style="display:none; z-index:9999; pointer-events:auto; background:rgba(0,0,0,0.2);"
            onclick="if(event.target === this) cerrarPanelSubrayados()">
            <div id="panel-subrayados"
                style="width: 350px; height: 100%; right: -350px; position: absolute; background: white; transition: right 0.3s ease; display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.1); pointer-events:auto;">
                <div class="header-ia">
                    <div class="header-ia-titulo">
                        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="width:20px;height:20px;">
                            <path d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                        <span data-i18n="ext-titulo">Gestor de Extracción</span>
                    </div>
                    <div class="header-ia-acciones">
                        <button class="btn-cerrar-ia" onclick="cerrarPanelSubrayados()" title="Cerrar Gestor" data-i18n-title="ext-cerrar">✕</button>
                    </div>
                </div>
                <div
                    style="padding: 10px 15px; font-size: 11px; color: #7f8c8d; border-bottom: 1px solid #eee; background:#fff;" data-i18n="ext-sub">
                    Textos resaltados sincronizados con el PDF.
                </div>
                <!-- SECCIÓN DE FILTROS -->
                <div
                    style="padding: 10px 15px; background: #fff; border-bottom: 1px solid #eee; display: flex; flex-direction: column; gap: 8px;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500;">
                        <span data-i18n="ext-filtros">Filtros</span>
                        <button onclick="limpiarFiltrosSubrayados()"
                            style="background: none; border: none; color: #3498db; cursor: pointer; font-size: 11px;" data-i18n="ext-limpiar">Limpiar</button>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <select id="filter-color" onchange="aplicarFiltrosSubrayados()"
                            style="flex: 1; padding: 4px; font-size: 11px; border: 1px solid #ddd; border-radius: 4px;">
                            <option value="" data-i18n="ext-color-todos">Todos los colores</option>
                            <option value="#FFFF00" data-i18n="color-amarillo">Amarillo</option>
                            <option value="#00FF00" data-i18n="color-verde">Verde</option>
                            <option value="#00FFFF" data-i18n="color-cian">Cian</option>
                            <option value="#FF00FF" data-i18n="color-magenta">Magenta</option>
                            <option value="#f1c40f" data-i18n="color-naranja">Naranja</option>
                            <option value="#e74c3c" data-i18n="color-rojo">Rojo</option>
                        </select>
                        <input type="number" id="filter-page" placeholder="Pág..." data-i18n-placeholder="ext-ph-pag" oninput="aplicarFiltrosSubrayados()"
                            style="width: 60px; padding: 4px; font-size: 11px; border: 1px solid #ddd; border-radius: 4px;"
                            min="1">
                    </div>
                </div>
                <!-- PESTAÑAS: TODAS / SUBRAYADOS / CAPTURAS -->
                <div class="tabs-extraccion" style="display: flex; border-bottom: 1px solid #eee; background: #fafbfc;">
                    <button type="button" class="tab-extraccion active" data-tab="todas" onclick="cambiarTabExtraccion('todas')"
                        style="flex: 1; padding: 8px 4px; font-size: 11px; font-weight: 600; border: none; background: none; cursor: pointer; border-bottom: 2px solid #3498db; color: #2c3e50;">
                        <span data-i18n="ext-tab-todas">Todas</span> <span id="count-ext-todas" style="font-weight: 400; font-size: 10px; color: #7f8c8d;">(0)</span>
                    </button>
                    <button type="button" class="tab-extraccion" data-tab="textos" onclick="cambiarTabExtraccion('textos')"
                        style="flex: 1; padding: 8px 4px; font-size: 11px; font-weight: 600; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; color: #7f8c8d;">
                        <span data-i18n="ext-tab-subrayados">📝 Subrayados</span> <span id="count-ext-textos" style="font-weight: 400; font-size: 10px; color: #7f8c8d;">(0)</span>
                    </button>
                    <button type="button" class="tab-extraccion" data-tab="capturas" onclick="cambiarTabExtraccion('capturas')"
                        style="flex: 1; padding: 8px 4px; font-size: 11px; font-weight: 600; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; color: #7f8c8d;">
                        <span style="display:inline-flex; align-items:center; gap:5px;">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <span data-i18n="ext-tab-capturas">Capturas</span> <span id="count-ext-capturas" style="font-weight: 400; font-size: 10px; color: #7f8c8d;">(0)</span>
                        </span>
                    </button>
                </div>
                <div id="extracted-texts"
                    style="flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f8f9fa;">
                    <!-- Aquí se inyectan las tarjetas de texto y capturas visuales -->
                </div>
            </div>
        </div>
