<div id="modal-ocr-progreso" class="overlay-bloqueante modal-ocr-overlay">
    <div class="modal-ocr-card modal-ocr-progreso-card" onclick="event.stopPropagation()">
        <div class="ocr-progreso-hero-icon">
            <svg class="lira-svg-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>
        <h3 class="ocr-modal-title ocr-progreso-title" data-i18n="ocr-prog-titulo">Procesando documento con RapidOCR</h3>
        <p id="ocr-progreso-texto-estado" class="ocr-progreso-sub" data-i18n="ocr-prog-sub">
            Extrayendo texto y coordenadas para sincronización de lectura...
        </p>

        <!-- Barra de Progreso -->
        <div class="ocr-progreso-bar-track">
            <div id="barra-ocr-progreso-fill" class="ocr-progreso-bar-fill"></div>
        </div>

        <div class="ocr-progreso-meta">
            <span id="ocr-progreso-contador" data-i18n="ocr-prog-contador-default">Página 1 de 1</span>
            <span id="ocr-progreso-porcentaje">0%</span>
        </div>
        <div id="ocr-progreso-tiempo-estimado" class="ocr-progreso-eta">
            <svg class="lira-svg-icon ocr-eta-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="ocr-progreso-tiempo-texto" data-i18n="ocr-prog-tiempo-calc">Calculando tiempo estimado...</span>
        </div>

        <button type="button" class="ocr-btn-cancel" onclick="cancelarBatchOCRYLeer()">
            <svg class="lira-svg-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <rect x="9" y="9" width="6" height="6"></rect>
            </svg>
            <span data-i18n="ocr-prog-cancelar">Cancelar y Empezar a Leer Ahora</span>
        </button>
    </div>
</div>
