<div id="panel-busqueda" class="buscador-panel" style="display:none;">
    <div class="buscador-header">
        <span class="buscador-titulo-wrap">
            <svg class="lira-svg-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span data-i18n="buscador-titulo">BUSCAR EN PDF</span>
        </span>
        <div class="buscador-controles">
            <span id="busqueda-contador" class="buscador-contador"></span>
            <button type="button" class="buscador-nav-btn" onclick="navegarBusquedaPDF(-1)" title="Coincidencia anterior" data-i18n-title="buscador-ant">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button type="button" class="buscador-nav-btn" onclick="navegarBusquedaPDF(1)" title="Siguiente coincidencia" data-i18n-title="buscador-sig">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button type="button" class="buscador-close-btn" onclick="cerrarBuscadorPDF()" title="Cerrar" data-i18n-title="btn-cerrar" aria-label="Cerrar">&times;</button>
        </div>
    </div>
    <div class="buscador-body">
        <input type="text" id="input-busqueda-pdf" class="buscador-input" placeholder="Escribe y presiona Enter..." data-i18n-placeholder="buscador-ph">
        <div id="resultados-busqueda" class="buscador-resultados"></div>
    </div>
</div>
