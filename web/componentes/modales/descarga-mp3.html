<div id="modal-descarga" class="overlay-bloqueante">
            <div id="panel-descarga"
                style="width: 560px; padding: 22px 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); background: #fff;">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 12px;">
                    <h3 style="margin:0; color: #2c3e50; border:none; padding:0;"><span
                            data-i18n="lbl-exportar-audio">Exportar y Guardar Estudio</span></h3>
                    <button type="button" class="btn-cerrar-x" onclick="cerrarModalDescarga()" title="Cerrar" data-i18n-title="btn-cerrar"
                        style="background:transparent; border:none; font-size:20px; line-height:1; cursor:pointer; color:#7f8c8d; padding:2px 6px; border-radius:6px;">&times;</button>
                </div>

                <!-- PESTAÑAS ESTILO CONFIGURACIÓN AVANZADA / TIENDA DE VOCES (.tab-btn) -->
                <div class="tabs-descarga-header" style="display:flex; gap:8px; margin-bottom:15px; border-bottom:1px solid #dfe6e9; padding-bottom:8px;">
                    <button type="button" id="tab-btn-export-mp3" class="tab-btn active" onclick="cambiarTabModalDescarga('mp3')"
                        style="flex:1; display:flex; align-items:center; justify-content:center; gap:7px; border-radius:6px;">
                        <svg class="svg-icon" viewBox="0 0 64 64" width="18" height="18">
                            <path class="svg-main" fill="#394240"
                                d="M32,44c6.629,0,12-5.371,12-12V12c0-6.629-5.371-12-12-12S20,5.371,20,12v20C20,38.629,25.371,44,32,44z M28,12c0-2.211,1.789-4,4-4s4,1.789,4,4v20c0,2.211-1.789,4-4,4s-4-1.789-4-4V12z" />
                            <path class="svg-main" fill="#394240"
                                d="M52,28c-2.211,0-4,1.789-4,4c0,8.836-7.164,16-16,16s-16-7.164-16-16c0-2.211-1.789-4-4-4s-4,1.789-4,4 c0,11.887,8.656,21.73,20,23.641V60c0,2.211,1.789,4,4,4s4-1.789,4-4v-4.359C47.344,53.73,56,43.887,56,32 C56,29.789,54.211,28,52,28z" />
                            <path class="svg-sec" fill="#45AAB8"
                                d="M28,12c0-2.211,1.789-4,4-4s4,1.789,4,4v20c0,2.211-1.789,4-4,4s-4-1.789-4-4V12z" />
                        </svg>
                        <span data-i18n="tab-export-mp3">Exportar Audio MP3</span>
                    </button>
                    <button type="button" id="tab-btn-export-pdf" class="tab-btn" onclick="cambiarTabModalDescarga('pdf')"
                        style="flex:1; display:flex; align-items:center; justify-content:center; gap:7px; border-radius:6px;">
                        <svg class="svg-icon" viewBox="0 0 24 24" width="18" height="18">
                            <path class="svg-main" fill="#394240"
                                d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2ZM18 20H6V4H13V9H18V20Z" />
                            <path class="svg-sec" fill="#45AAB8"
                                d="M12 18L8.5 14.5L9.91 13.09L11 14.17V10.5H13V14.17L14.09 13.09L15.5 14.5L12 18Z" />
                        </svg>
                        <span data-i18n="tab-export-pdf">Guardar / Exportar PDF</span>
                    </button>
                </div>

                <!-- PESTAÑA 1: EXPORTAR AUDIO MP3 -->
                <div id="tab-content-export-mp3">

                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div style="flex: 1; position: relative;">
                        <label style="font-size: 11px; font-weight: bold; color: #7f8c8d;"><span
                                data-i18n="lbl-idioma-mp3">🌐 IDIOMA:</span></label>
                        <div style="position: relative;">
                            <input type="text" id="busqueda-idioma-mp3" placeholder="Español..." data-i18n-placeholder="ph-idioma-mp3"
                                oninput="filtrarComboMp3('idioma')" onclick="abrirComboMp3('idioma')"
                                style="width:100%; padding:8px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box;">
                            <span
                                style="position: absolute; right: 10px; top: 8px; color: #bdc3c7; pointer-events: none;">▼</span>
                        </div>
                        <select id="modal-filtro-idioma" class="opcion-combo" size="5"
                            onchange="seleccionarComboMp3('idioma')"
                            style="display:none; position:absolute; width:100%; z-index:1001; background:white; border:1px solid #3498db;"></select>
                    </div>

                    <div style="flex: 1; position: relative;">
                        <label style="font-size: 11px; font-weight: bold; color: #7f8c8d;"><span
                                data-i18n="lbl-voz-mp3">🗣️
                                VOZ (Escribe para buscar):</span></label>
                        <div style="position: relative;">
                            <input type="text" id="busqueda-voz-mp3" placeholder="Raul, Dalia..." data-i18n-placeholder="ph-voz-mp3"
                                oninput="filtrarComboMp3('voz')" onclick="abrirComboMp3('voz')"
                                style="width:100%; padding:8px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box;">
                            <span
                                style="position: absolute; right: 10px; top: 8px; color: #bdc3c7; pointer-events: none;">▼</span>
                        </div>
                        <select id="modal-voz" class="opcion-combo" size="6" onchange="seleccionarComboMp3('voz')"
                            style="display:none; position:absolute; width:100%; z-index:1001; background:white; border:1px solid #3498db;"></select>
                    </div>
                </div>

                <div
                    style="display: flex; gap: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ecf0f1;">
                    <div style="flex: 1;">
                        <label style="font-size: 11px; font-weight: bold;"><span data-i18n="lbl-paginas">📄
                                PÁGINAS:</span></label>
                        <div style="display: flex; align-items: center; gap: 10px; margin-top:5px;">
                            <input type="number" id="modal-pag-ini" value="1" onchange="previsualizarPagina('ini')"
                                style="width:60px; padding:5px;">
                            <span data-i18n="lbl-a">a</span>
                            <input type="number" id="modal-pag-fin" value="1" onchange="previsualizarPagina('fin')"
                                style="width:60px; padding:5px;">
                        </div>
                        <div style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <label style="font-size: 12px;"><input type="checkbox" id="mp3-chk-abbr" checked> <span
                                    data-i18n="lbl-abbr-chk">Abreviaturas</span></label>
                            <label style="font-size: 12px;"><input type="checkbox" id="mp3-chk-limits" checked> <span
                                    data-i18n="lbl-limites-chk">Límites</span></label>
                        </div>
                    </div>
                    <div style="display:flex; gap:10px; align-items:flex-start;">
                        <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                            <span style="font-size:10px; font-weight:700; color:#64748b;" data-i18n="lbl-preview-inicio">Inicio</span>
                            <div style="width: 112px; height: 150px; background: #ddd; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #bdc3c7;">
                                <img id="img-preview-mp3-ini" style="max-width: 100%; max-height: 100%; display: none;">
                                <span id="txt-preview-mp3-ini" style="font-size: 10px; color: #7f8c8d; text-align: center;" data-i18n="lbl-previsualizacion">Previsualización</span>
                            </div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                            <span style="font-size:10px; font-weight:700; color:#64748b;" data-i18n="lbl-preview-fin">Fin</span>
                            <div style="width: 112px; height: 150px; background: #ddd; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #bdc3c7;">
                                <img id="img-preview-mp3-fin" style="max-width: 100%; max-height: 100%; display: none;">
                                <span id="txt-preview-mp3-fin" style="font-size: 10px; color: #7f8c8d; text-align: center;" data-i18n="lbl-previsualizacion">Previsualización</span>
                            </div>
                        </div>
                    </div>
                </div>




                <div style="margin-top: 15px;">
                    <label style="font-size: 12px;"><span data-i18n="lbl-velocidad-mp3">🐇 VELOCIDAD:</span> <span
                            id="modal-val-vel">1.0x</span></label>
                    <input type="range" id="modal-rng-vel" min="0.5" max="3.0" value="1.0" step="0.1"
                        oninput="document.getElementById('modal-val-vel').innerText = this.value + 'x'"
                        style="width:100%;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
                    <div id="mp3-box-teatro" style="background: #f0f0f0; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                        <label
                            style="display: flex; align-items: center; gap: 8px; cursor: pointer; justify-content: center;">
                            <input type="checkbox" id="chk-teatro-export"
                                style="width: 17px; height: 17px; cursor: pointer;">
                            <span style="font-size: 12px; font-weight: bold; color: #d33682;"><span
                                    data-i18n="lbl-teatro-export">🎭 ACTIVAR MODO TEATRO</span></span>
                        </label>
                    </div>
                    <div id="mp3-box-traduccion" style="background: #eef6fc; padding: 10px; border-radius: 5px; border: 1px solid #b8daff;">
                        <label
                            style="display: flex; align-items: center; gap: 8px; cursor: pointer; justify-content: center;">
                            <input type="checkbox" id="chk-traduccion-export"
                                onchange="actualizarUIControlesTraduccionMp3()"
                                style="width: 17px; height: 17px; cursor: pointer;">
                            <span style="font-size: 12px; font-weight: bold; color: #1d4ed8;"><span
                                    data-i18n="lbl-traduccion-export">🌐 Con traducción</span></span>
                        </label>
                    </div>
                </div>

                <div id="mp3-trad-wrap" style="display: none; margin-top: 10px; padding: 8px 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <select id="mp3-trad-destino" style="flex: 1; min-width: 130px; padding: 5px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 12px;"></select>
                    <select id="mp3-trad-modo" style="flex: 1; min-width: 140px; padding: 5px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 12px;">
                        <option value="solo_traduccion" data-i18n="opt-trad-solo">Solo traducción</option>
                        <option value="aprendizaje" data-i18n="opt-trad-bilingue">Original + Traducción</option>
                    </select>
                </div>

                <div style="margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <label style="font-size: 12px; font-weight: bold; color: #555;" data-i18n="lbl-corte-mp3">Cortes:</label>
                    <select id="mp3-corte-modo" onchange="actualizarUIControlesCorteMp3()" style="flex:1; min-width:160px; padding:6px; border:1px solid #bdc3c7; border-radius:4px;">
                        <option value="unico" data-i18n="opt-corte-unico">Archivo único</option>
                        <option value="pagina" data-i18n="opt-corte-pagina">Por página</option>
                        <option value="seccion" data-i18n="opt-corte-seccion">Por sección / capítulo</option>
                        <option value="duracion" data-i18n="opt-corte-duracion">Por duración máxima (min)</option>
                    </select>
                    <span id="mp3-corte-pag-wrap" style="display:none; align-items:center; gap:4px;">
                        <input type="number" id="mp3-corte-paginas" value="1" min="1" max="500" style="width:55px; padding:5px;">
                        <span style="font-size:11px;" data-i18n="lbl-pags-corto">págs</span>
                    </span>
                    <span id="mp3-corte-min-wrap" style="display:none; align-items:center; gap:4px;">
                        <input type="number" id="mp3-corte-minutos" value="15" min="1" max="180" style="width:55px; padding:5px;">
                        <span style="font-size:11px;">min</span>
                    </span>
                    <label style="font-size: 12px; display:inline-flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="checkbox" id="mp3-chk-zip" checked>
                        <span data-i18n="lbl-empaquetar-zip">ZIP si hay varios</span>
                    </label>
                </div>

                <div id="barra-contenedor" style="display:none; margin-top:15px;">
                    <div id="barra-progreso"></div>
                </div>
                <p id="txt-estado-descarga" style="color: #27ae60; font-size: 12px; margin-top: 5px; min-height: 15px;">
                </p>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button id="btn-cancelar-exportacion" onclick="cerrarModalDescarga()"
                        style="flex:1; padding:12px; background:#95a5a6; border:none; color:white; border-radius:6px; cursor:pointer;"
                        data-i18n="btn-cancelar">Cancelar</button>
                    <button id="btn-iniciar-descarga" onclick="iniciarDescargaFinal()"
                        style="flex:2; padding:12px; background:#27ae60; border:none; color:white; border-radius:6px; cursor:pointer; font-weight:bold;"
                        data-i18n="btn-generar-mp3">GENERAR ESTUDIO MP3</button>
                </div>
                </div>

                <!-- PESTAÑA 2: GUARDAR / DESCARGAR PDF CONFIGURADO -->
                <div id="tab-content-export-pdf" style="display:none; text-align:left;">
                    <div id="pdf-export-card-rango"
                        style="display: flex; gap: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ecf0f1;">
                        <div style="flex: 1; display:flex; flex-direction:column; justify-content:space-between;">
                            <div>
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <label style="font-size: 11px; font-weight: bold;"><span data-i18n="lbl-paginas">PÁGINAS:</span></label>
                                    <button type="button" onclick="aplicarTodoRangoPdfExport()"
                                        style="font-size:11px; padding:2px 8px; border-radius:4px; border:1px solid #cbd5e1; background:transparent; cursor:pointer; color:#3498db; font-weight:600;"
                                        data-i18n="btn-todo-documento">Todo el PDF</button>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px; margin-top:8px;">
                                    <input type="number" id="pdf-export-pag-ini" value="1" min="1" onchange="previsualizarPaginaPdfExport('ini')"
                                        style="width:65px; padding:6px;">
                                    <span data-i18n="lbl-a">a</span>
                                    <input type="number" id="pdf-export-pag-fin" value="1" min="1" onchange="previsualizarPaginaPdfExport('fin')"
                                        style="width:65px; padding:6px;">
                                </div>
                            </div>

                            <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px;">
                                <label style="font-size: 12px; display:flex; align-items:center; gap:7px; cursor:pointer;">
                                    <input type="checkbox" id="pdf-chk-subrayados" checked style="width:15px; height:15px; cursor:pointer;">
                                    <span data-i18n="lbl-pdf-incluir-subrayados">Incluir subrayados y marcatextos</span>
                                </label>
                                <label style="font-size: 12px; display:flex; align-items:center; gap:7px; cursor:pointer;"
                                    title="Fusiona los subrayados y cuadros de texto de forma permanente en la página para que no puedan alterarse">
                                    <input type="checkbox" id="pdf-chk-aplanar" style="width:15px; height:15px; cursor:pointer;">
                                    <span data-i18n="lbl-pdf-aplanar">Aplanar ediciones (fijar en página)</span>
                                </label>
                                <label style="font-size: 12px; display:flex; align-items:center; gap:7px; cursor:pointer;">
                                    <input type="checkbox" id="pdf-chk-optimizar" checked style="width:15px; height:15px; cursor:pointer;">
                                    <span data-i18n="lbl-pdf-optimizar">Optimizar y comprimir tamaño</span>
                                </label>
                            </div>
                        </div>

                        <div style="display:flex; gap:10px; align-items:flex-start;">
                            <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                                <span style="font-size:10px; font-weight:700; color:#64748b;" data-i18n="lbl-preview-inicio">Inicio</span>
                                <div style="width: 112px; height: 150px; background: #ddd; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #bdc3c7;">
                                    <img id="img-preview-pdf-ini" style="max-width: 100%; max-height: 100%; display: none;">
                                    <span id="txt-preview-pdf-ini" style="font-size: 10px; color: #7f8c8d; text-align: center;" data-i18n="lbl-previsualizacion">Previsualización</span>
                                </div>
                            </div>
                            <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
                                <span style="font-size:10px; font-weight:700; color:#64748b;" data-i18n="lbl-preview-fin">Fin</span>
                                <div style="width: 112px; height: 150px; background: #ddd; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #bdc3c7;">
                                    <img id="img-preview-pdf-fin" style="max-width: 100%; max-height: 100%; display: none;">
                                    <span id="txt-preview-pdf-fin" style="font-size: 10px; color: #7f8c8d; text-align: center;" data-i18n="lbl-previsualizacion">Previsualización</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <label style="font-size: 12px; font-weight: bold; color: #555;" data-i18n="lbl-corte-mp3">Cortes:</label>
                        <select id="pdf-corte-modo" onchange="actualizarUIControlesCortePdfExport()" style="flex:1; min-width:170px; padding:6px; border:1px solid #bdc3c7; border-radius:4px;">
                            <option value="unico" data-i18n="opt-corte-unico">Archivo único</option>
                            <option value="pagina" data-i18n="opt-corte-pagina">Por página</option>
                            <option value="seccion" data-i18n="opt-corte-seccion">Por sección / capítulo</option>
                        </select>
                        <span id="pdf-corte-pag-wrap" style="display:none; align-items:center; gap:4px;">
                            <input type="number" id="pdf-corte-paginas" value="1" min="1" max="500" style="width:55px; padding:5px;">
                            <span style="font-size:11px;" data-i18n="lbl-pags-corto">págs</span>
                        </span>
                    </div>

                    <p id="txt-estado-export-pdf" style="color: #27ae60; font-size: 12px; margin-top: 8px; min-height: 16px;"></p>

                    <div style="display: flex; gap: 10px; margin-top: 14px;">
                        <button type="button" id="btn-cancelar-export-pdf" onclick="cerrarModalDescarga()"
                            style="flex:1; padding:12px; background:#95a5a6; border:none; color:white; border-radius:6px; cursor:pointer;"
                            data-i18n="btn-cancelar">Cancelar</button>
                        <button type="button" id="btn-iniciar-export-pdf" onclick="iniciarExportacionPdfConfigurado()"
                            style="flex:2; padding:12px; background:#27ae60; border:none; color:white; border-radius:6px; cursor:pointer; font-weight:bold;"
                            data-i18n="btn-guardar-pdf-estudio">GUARDAR DOCUMENTO PDF</button>
                    </div>
                </div>
            </div>
        </div>
