<div id="tab-idioma" class="tab-content" style="display:none;">
                        <div class="grupo-calibracion"
                            style="border: 2px solid #d35400; background: #fff0e6; padding: 15px; border-radius: 8px; margin-top: 15px;">
                            <h4 style="margin-top:0; color: #c0392b; border-bottom: 1px solid #e6b0aa; padding-bottom: 5px;"
                                data-i18n="lbl-idioma-titulo">Idioma de la Interfaz</h4>
                            <p style="font-size: 11px; color: #7f8c8d; line-height: 1.4; margin-bottom: 15px;"
                                data-i18n="lbl-idioma-desc">
                                Selecciona el idioma con el que deseas utilizar la aplicación.
                            </p>

                            <div style="display:flex; flex-direction:column; gap:10px;">
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="es"
                                        onchange="toggleIdiomaDrop(this.value)"> Español (América Latina)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="en"
                                        onchange="toggleIdiomaDrop(this.value)" checked> English (United States)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="fr"
                                        onchange="toggleIdiomaDrop(this.value)"> Français (France)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="de"
                                        onchange="toggleIdiomaDrop(this.value)"> Deutsch (Deutschland)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="zh"
                                        onchange="toggleIdiomaDrop(this.value)"> 中文 (China)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="pt"
                                        onchange="toggleIdiomaDrop(this.value)"> Português (Brasil)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="ru"
                                        onchange="toggleIdiomaDrop(this.value)"> Русский (Россия)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="ar"
                                        onchange="toggleIdiomaDrop(this.value)"> العربية (Arabic)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="hi"
                                        onchange="toggleIdiomaDrop(this.value)"> हिन्दी (Hindi)
                                </label>
                                <label class="idioma-opcion"
                                    style="display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px; border:1px solid #ccc; border-radius:4px;">
                                    <input type="radio" name="radio-idioma" value="bn"
                                        onchange="toggleIdiomaDrop(this.value)"> বাংলা (Bengali)
                                </label>
                            </div>
                        </div>
                    </div>
