                        <svg class="lira-svg-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                    </button>

                        <svg class="lira-svg-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        <span data-i18n="btn-saltar-tutorial">Saltar Guía</span>
                    </button>
                </div>
            </div>

                <svg class="lira-svg-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3l1.91 5.09L19 10l-5.09 1.91L12 17l-1.91-5.09L5 10l5.09-1.91L12 3z"></path>
                </svg>
                <span id="tour-card-title-texto" data-i18n="tour-paso1-titulo">Bienvenido a LiraLoud</span>
            </h3>

            </div>
            <div class="tour-card-footer">

                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
